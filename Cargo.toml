[package]
name = "oud"
version = "0.1.1"
edition = "2024"
description = "oud. your signal, in the terminal."
readme = "README.md"
license = "MIT"
repository = "https://github.com/oud-so/oud-terminal"
homepage = "https://oud.so"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
country-boundaries = "1.2.0"
cpal = "0.18.2"
crossterm = "0.29.0"
directories = "6.0.0"
fastrand = "2.5.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
ringbuf = "0.5.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "flac", "adpcm", "pcm", "wav", "isomp4"] }
unicode-width = "0.2.3"
urlencoding = "2.1.3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

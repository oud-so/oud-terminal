# A release, from a version tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# builds oud for Apple silicon and Intel Macs, puts the two archives on a
# release of the public tap (oud-so/homebrew-tap, since this repo is
# private and Homebrew downloads without credentials), writes the formula
# there, and only then publishes the release. The API reads the newest
# published release, so copies hear of it once `brew upgrade` can give it.
#
# Needs the TAP_TOKEN secret: a fine-grained token with read and write
# access to the contents of oud-so/homebrew-tap.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  TAP: oud-so/homebrew-tap

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag but Cargo.toml says $crate"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --release --locked

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
            bin="target/$target/release/oud"
            # The version this binary reports is the one being released.
            [ "$target" = aarch64-apple-darwin ] && "$bin" --version | grep -qx "oud $VERSION"
            tar -czf "dist/oud-$VERSION-$target.tar.gz" -C "target/$target/release" oud
          done
          (cd dist && shasum -a 256 *.tar.gz | tee checksums.txt)

      - name: Put the archives on a draft release of the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$TAP" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --repo "$TAP" --clobber
          else
            gh release create "v$VERSION" dist/* --repo "$TAP" --draft \
              --title "oud $VERSION" --notes "brew upgrade oud"
          fi

      - name: Write the formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha() { awk -v f="oud-$VERSION-$1.tar.gz" '$2 == f { print $1 }' dist/checksums.txt; }
          base="https://github.com/$TAP/releases/download/v$VERSION"
          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/oud.rb <<EOF
          class Oud < Formula
            desc "Internet radio from every country, in the terminal"
            homepage "https://oud.so"
            license "MIT"
            version "$VERSION"

            on_macos do
              on_arm do
                url "$base/oud-$VERSION-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/oud-$VERSION-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            def install
              bin.install "oud"
            end

            test do
              assert_match "oud #{version}", shell_output("#{bin}/oud --version")
            end
          end
          EOF
          cd tap
          git config user.name "oud release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/oud.rb
          git diff --cached --quiet || git commit -m "oud $VERSION"
          git branch -M main
          git push origin main

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$TAP" --draft=false --latest
